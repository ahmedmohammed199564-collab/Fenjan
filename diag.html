<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فنجان — فحص التسجيل</title>
<style>
  body{font-family:system-ui,Tahoma,sans-serif;background:#0F1614;color:#E8EFEC;margin:0;padding:18px;line-height:1.8}
  h1{color:#4FC3AC;font-size:20px}
  pre{background:#18221F;border:1px solid #2B3834;border-radius:10px;padding:14px;white-space:pre-wrap;word-break:break-word;font-size:16px}
  .ok{color:#6FD39A;font-weight:700} .bad{color:#FF8A7E;font-weight:700} .k{color:#9AA8A4}
  button{background:#4FC3AC;color:#06211C;border:0;border-radius:10px;padding:14px 22px;font-size:17px;font-weight:700;margin:10px 0}
</style>
</head>
<body>
<h1>فحص التسجيل</h1>
<p class="k">دوس الزرار، واستنى النتيجة تظهر تحت، وصوّرها كلها.</p>
<button onclick="run()">ابدأ الفحص</button>
<pre id="out">—</pre>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const out = document.getElementById('out');
const L = (k,v,c)=> `<span class="k">${k}:</span> <span class="${c||''}">${v}</span>\n`;
async function run(){
  const C = window.FENJAN_CONFIG||{};
  let t = '';
  t += L('العنوان', C.SUPABASE_URL||'(فاضي)');
  t += L('المكتبة', typeof window.supabase==='object'?'متحمّلة':'مش متحمّلة', typeof window.supabase==='object'?'ok':'bad');
  out.innerHTML = t+'\n…';
  let sb;
  try{ sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_KEY); }catch(e){ out.innerHTML=t+L('إنشاء العميل', String(e),'bad'); return; }
  const email = 'test_'+Date.now()+'@fenjan-staff.com';
  t += L('\nإيميل الاختبار', email);
  let uid=null;
  try{
    const { data, error } = await sb.auth.signUp({ email, password:'test123456', options:{ data:{ full_name:'اختبار', phone:'01000000000' } } });
    if(error){ t+=L('١) التسجيل','فشل ✗','bad'); t+=L('   الكود',(error.status||'?')+' / '+(error.code||'?'),'bad'); t+=L('   الرسالة',error.message,'bad'); out.innerHTML=t; return; }
    t+=L('١) التسجيل','نجح ✓','ok');
    uid = data.user && data.user.id;
    t+=L('   المستخدم', uid?('اتعمل '+uid.slice(0,8)):'لأ', uid?'ok':'bad');
    t+=L('   جلسة', data.session?'موجودة ✓':'مفيش — تأكيد الإيميل لسه مفتوح', data.session?'ok':'bad');
    if(!data.session){ out.innerHTML=t+'\n⚠ اقفل Confirm email من Supabase.'; return; }
  }catch(e){ out.innerHTML=t+L('١) التسجيل','استثناء: '+String(e),'bad'); return; }
  out.innerHTML=t+'\n…';
  // 2) profile via ensure_profile
  try{
    let { data:p } = await sb.from('profiles').select('id,role').eq('id',uid).maybeSingle();
    if(!p){ await sb.rpc('ensure_profile'); const r = await sb.from('profiles').select('id,role').eq('id',uid).maybeSingle(); p = r.data; }
    t+=L('٢) ملف الموظف', p?('موجود ✓ (صلاحية: '+p.role+')'):'مش موجود ✗', p?'ok':'bad');
  }catch(e){ t+=L('٢) ملف الموظف','خطأ: '+(e.message||e),'bad'); }
  // 3) settings read
  try{ const { data:s, error:se } = await sb.from('settings').select('id,site_lat').eq('id',1).maybeSingle(); t+=L('٣) الإعدادات', se?('خطأ: '+se.message):'اتقرت ✓', se?'bad':'ok'); }catch(e){ t+=L('٣) الإعدادات','خطأ','bad'); }
  await sb.auth.signOut();
  t+='\n<span class="ok">لو كل السطور ✓ يبقى التطبيق هيشتغل. امسح حساب الاختبار من Supabase.</span>';
  out.innerHTML=t;
}
</script>
</body>
</html>

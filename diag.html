<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فنجان — اختبار</title>
<style>
  body{font-family:system-ui,Tahoma,sans-serif;background:#0F1614;color:#E8EFEC;margin:0;padding:20px;line-height:1.7}
  h1{color:#4FC3AC;font-size:20px}
  pre{background:#18221F;border:1px solid #2B3834;border-radius:10px;padding:14px;white-space:pre-wrap;word-break:break-word;font-size:15px}
  .ok{color:#6FD39A} .bad{color:#FF8A7E} .k{color:#9AA8A4}
  button{background:#4FC3AC;color:#06211C;border:0;border-radius:10px;padding:12px 20px;font-size:16px;font-weight:700;margin-top:12px}
</style>
</head>
<body>
<h1>اختبار اتصال فنجان</h1>
<p class="k">دي صفحة تشخيص مؤقتة. استنى النتيجة تظهر تحت وصوّرها.</p>
<pre id="out">جاري الاختبار…</pre>
<button onclick="location.reload()">إعادة الاختبار</button>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const out = document.getElementById('out');
function line(label, val, cls){ return `<span class="k">${label}:</span> <span class="${cls||''}">${val}</span>\n`; }
(async function(){
  const C = window.FENJAN_CONFIG || {};
  let t = '';
  t += line('العنوان', C.SUPABASE_URL || '(فاضي)');
  t += line('المفتاح', C.SUPABASE_KEY ? (C.SUPABASE_KEY.slice(0,18)+'… ('+C.SUPABASE_KEY.length+' حرف)') : '(فاضي)');
  t += line('مكتبة Supabase', typeof window.supabase === 'object' ? 'متحمّلة' : 'مش متحمّلة', typeof window.supabase==='object'?'ok':'bad');
  out.innerHTML = t + '\n…';
  let sb;
  try { sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_KEY); t += line('إنشاء العميل', 'تمام', 'ok'); }
  catch(e){ out.innerHTML = t + line('إنشاء العميل', String(e), 'bad'); return; }

  // health
  try {
    const h = await fetch(C.SUPABASE_URL + '/auth/v1/health', { headers:{ apikey:C.SUPABASE_KEY } });
    t += line('نظام الدخول (health)', h.status, h.ok?'ok':'bad');
  } catch(e){ t += line('نظام الدخول', String(e), 'bad'); }
  out.innerHTML = t + '\n…';

  // the real signup test
  const email = 'diag_' + Date.now() + '@fenjan-staff.com';
  t += line('\nإيميل الاختبار', email);
  try {
    const { data, error } = await sb.auth.signUp({ email, password: 'diag123456', options:{ data:{ full_name:'اختبار', phone:'0100' } } });
    if (error) {
      t += line('نتيجة التسجيل', 'فشل ✗', 'bad');
      t += line('الكود', (error.status||'?') + ' / ' + (error.code||'?'), 'bad');
      t += line('الرسالة', error.message, 'bad');
    } else {
      t += line('نتيجة التسجيل', 'نجح ✓', 'ok');
      t += line('المستخدم اتعمل', data.user ? ('أيوه — ' + data.user.id.slice(0,8)) : 'لأ', data.user?'ok':'bad');
      t += line('فيه جلسة (دخول مباشر)', data.session ? 'أيوه ✓' : 'لأ — محتاج تأكيد إيميل', data.session?'ok':'bad');
    }
  } catch(e){ t += line('نتيجة التسجيل', 'استثناء: ' + String(e), 'bad'); }
  out.innerHTML = t;
})();
</script>
</body>
</html>

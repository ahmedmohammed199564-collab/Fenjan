<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script>
// Remove any old service worker + caches, then load once fresh. Prevents stale app code.
(function(){
  try{
    if('serviceWorker' in navigator){
      navigator.serviceWorker.getRegistrations().then(function(rs){
        var had = rs.length>0;
        Promise.all(rs.map(function(r){return r.unregister();})).then(function(){
          if(window.caches&&caches.keys){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});});}
          if(had && !sessionStorage.getItem('swcleared')){ sessionStorage.setItem('swcleared','1'); location.reload(); }
        });
      }).catch(function(){});
    }
  }catch(e){}
})();
</script>
